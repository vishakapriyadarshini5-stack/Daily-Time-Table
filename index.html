
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timetable</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background:
            radial-gradient(circle at 20% 10%, rgba(255,255,255,0.08), transparent 28%),
            radial-gradient(circle at 80% 80%, rgba(120,150,255,0.08), transparent 30%),
            #0b0d11;
        color: #f5f5f7;
        min-height: 100vh;
        overflow-x: hidden;
    }

    .page {
        padding: 28px;
        max-width: 1500px;
        margin: auto;
    }

    /* HEADER */

    header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 25px;
    }

    .title-area h1 {
        margin: 0;
        font-size: 34px;
        letter-spacing: -1px;
    }

    .title-area p {
        margin: 5px 0 0;
        color: #8f939d;
        font-size: 14px;
    }

    .unusual-btn {
        border: 1px solid rgba(255,255,255,0.12);
        background: rgba(255,255,255,0.07);
        color: white;
        padding: 13px 20px;
        border-radius: 999px;
        cursor: pointer;
        font-size: 14px;
        backdrop-filter: blur(18px);
        transition: 0.25s ease;
    }

    .unusual-btn:hover {
        background: rgba(255,255,255,0.13);
        transform: translateY(-2px);
    }

    /* CALENDAR */

    .calendar-wrapper {
        position: relative;
        overflow-x: auto;
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 24px;
        background: rgba(255,255,255,0.035);
        backdrop-filter: blur(20px);
        box-shadow: 0 20px 70px rgba(0,0,0,0.35);
    }

    .calendar {
        min-width: 1050px;
        display: grid;
        grid-template-columns: 70px repeat(7, 1fr);
    }

    .day-header,
    .time-header {
        height: 70px;
        border-bottom: 1px solid rgba(255,255,255,0.07);
        border-right: 1px solid rgba(255,255,255,0.05);
    }

    .time-header {
        background: rgba(255,255,255,0.025);
    }

    .day-header {
        padding: 14px;
        position: relative;
    }

    .day-name {
        font-size: 13px;
        color: #90949d;
    }

    .day-number {
        font-size: 23px;
        font-weight: 600;
        margin-top: 4px;
    }

    .today-header {
        background: rgba(255,255,255,0.07);
    }

    .today-header::after {
        content: "TODAY";
        position: absolute;
        right: 12px;
        top: 13px;
        font-size: 9px;
        letter-spacing: 1px;
        color: #aeb4ff;
    }

    .time {
        height: 70px;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding-top: 10px;
        color: #777c86;
        font-size: 11px;
        border-right: 1px solid rgba(255,255,255,0.05);
        border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .slot {
        height: 70px;
        border-right: 1px solid rgba(255,255,255,0.05);
        border-bottom: 1px solid rgba(255,255,255,0.05);
        position: relative;
        padding: 6px;
        transition: background 0.2s;
    }

    .slot:hover {
        background: rgba(255,255,255,0.035);
    }

    .today-column {
        background: rgba(255,255,255,0.018);
    }

    /* EVENTS */

    .event {
        width: 100%;
        min-height: 56px;
        border-radius: 15px;
        padding: 9px 11px;
        background: rgba(255,255,255,0.11);
        border: 1px solid rgba(255,255,255,0.12);
        backdrop-filter: blur(12px);
        font-size: 12px;
        cursor: pointer;
        transition: 0.2s;
        position: relative;
        z-index: 5;
    }

    .event:hover {
        transform: translateY(-1px);
        background: rgba(255,255,255,0.16);
    }

    .event-time {
        color: #9b9fa8;
        font-size: 10px;
        margin-top: 3px;
    }

    .delete-event {
        margin-top: 7px;
        border: none;
        background: rgba(255,255,255,0.08);
        color: #aaa;
        padding: 5px 9px;
        border-radius: 999px;
        font-size: 10px;
        cursor: pointer;
        transition: 0.2s;
    }

    .delete-event:hover {
        background: rgba(255,255,255,0.16);
        color: white;
    }

    .add {
        position: absolute;
        right: 8px;
        bottom: 8px;
        opacity: 0;
        border: none;
        background: rgba(255,255,255,0.08);
        color: #aaa;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        cursor: pointer;
        transition: 0.2s;
    }

    .slot:hover .add {
        opacity: 1;
    }

    /* UNUSUAL DAY */

    .today-column.cracked {
        animation: crackFall 1.1s cubic-bezier(.7,-0.2,.2,1) forwards;
        transform-origin: top center;
        position: relative;
        z-index: 10;
    }

    @keyframes crackFall {
        0% {
            transform: translateY(0) rotate(0deg);
            opacity: 1;
        }

        35% {
            transform: translateY(12px) rotate(0.5deg);
            opacity: 0.9;
        }

        100% {
            transform: translateY(150px) rotate(4deg);
            opacity: 0.18;
        }
    }

    .crack {
        position: absolute;
        z-index: 20;
        pointer-events: none;
        width: 2px;
        background: rgba(255,255,255,0.65);
        transform-origin: top;
        filter: blur(0.2px);
    }

    .crack.one {
        left: 30%;
        top: 5%;
        height: 48%;
        transform: rotate(17deg);
    }

    .crack.two {
        left: 48%;
        top: 18%;
        height: 60%;
        transform: rotate(-13deg);
    }

    .crack.three {
        left: 68%;
        top: 3%;
        height: 45%;
        transform: rotate(22deg);
    }

    .crack.four {
        left: 48%;
        top: 50%;
        height: 25%;
        transform: rotate(65deg);
    }

    /* UNUSUAL PANEL */

    .unusual-panel {
        display: none;
        margin-top: 20px;
        padding: 24px;
        border-radius: 22px;
        background: rgba(255,255,255,0.055);
        border: 1px solid rgba(255,255,255,0.08);
        backdrop-filter: blur(20px);
        animation: panelIn 0.35s ease;
    }

    .unusual-panel.show {
        display: block;
    }

    @keyframes panelIn {
        from {
            opacity: 0;
            transform: translateY(10px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .unusual-panel h2 {
        margin: 0 0 5px;
        font-size: 20px;
    }

    .unusual-panel p {
        margin: 0 0 18px;
        color: #8f939d;
        font-size: 13px;
    }

    .choices {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
    }

    .choice {
        border: 1px solid rgba(255,255,255,0.09);
        background: rgba(255,255,255,0.06);
        color: white;
        padding: 12px 16px;
        border-radius: 999px;
        cursor: pointer;
        transition: 0.2s;
    }

    .choice:hover {
        background: rgba(255,255,255,0.13);
        transform: translateY(-2px);
    }

    .selected-message {
        margin-top: 16px;
        color: #bfc4ff;
        font-size: 13px;
        display: none;
    }

    /* MODAL */

    .modal {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.55);
        backdrop-filter: blur(8px);
        align-items: center;
        justify-content: center;
        z-index: 100;
    }

    .modal.show {
        display: flex;
    }

    .modal-box {
        width: min(400px, calc(100% - 30px));
        padding: 25px;
        border-radius: 24px;
        background: #15171d;
        border: 1px solid rgba(255,255,255,0.1);
        box-shadow: 0 25px 80px rgba(0,0,0,0.5);
    }

    .modal-box h2 {
        margin-top: 0;
    }

    input {
        width: 100%;
        padding: 13px;
        margin: 8px 0;
        border-radius: 12px;
        border: 1px solid rgba(255,255,255,0.1);
        background: rgba(255,255,255,0.05);
        color: white;
        outline: none;
    }

    .modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 12px;
    }

    .modal-actions button {
        border: none;
        border-radius: 999px;
        padding: 10px 16px;
        cursor: pointer;
    }

    .cancel {
        background: rgba(255,255,255,0.07);
        color: white;
    }

    .save {
        background: white;
        color: black;
    }

    @media(max-width: 700px) {

        .page {
            padding: 15px;
        }

        header {
            align-items: flex-start;
            gap: 15px;
        }

        .title-area h1 {
            font-size: 28px;
        }

        .unusual-btn {
            padding: 10px 14px;
        }
    }
</style>
</head>

<body>

<div class="page">

    <header>

        <div class="title-area">
            <h1>Timetable</h1>
            <p id="weekLabel"></p>
        </div>

        <button class="unusual-btn" id="unusualBtn">
            Unusual day
        </button>

    </header>


    <div class="calendar-wrapper">

        <div class="calendar" id="calendar"></div>

    </div>


    <div class="unusual-panel" id="unusualPanel">

        <h2>Today is different ✦</h2>

        <p>What changed today?</p>

        <div class="choices">

            <button class="choice" data-reason="Family / cousin">
                👨‍👩‍👧 Family / cousin
            </button>

            <button class="choice" data-reason="Went out">
                🚗 Went out
            </button>

            <button class="choice" data-reason="Something else">
                ✦ Something else
            </button>

        </div>

        <div class="selected-message" id="selectedMessage"></div>

    </div>

</div>


<!-- ADD EVENT MODAL -->

<div class="modal" id="eventModal">

    <div class="modal-box">

        <h2>Add event</h2>

        <input
            id="eventName"
            placeholder="Event name"
        >

        <div class="modal-actions">

            <button
                class="cancel"
                id="cancelModal"
            >
                Cancel
            </button>

            <button
                class="save"
                id="saveEvent"
            >
                Add
            </button>

        </div>

    </div>

</div>


<script>

/* =========================================
   BASIC SETTINGS
========================================= */

const calendar = document.getElementById("calendar");

const unusualBtn =
    document.getElementById("unusualBtn");

const unusualPanel =
    document.getElementById("unusualPanel");

const selectedMessage =
    document.getElementById("selectedMessage");


/* =========================================
   DAYS & TIMES
========================================= */

const days = [
    "Monday",
    "Tuesday",
    "Wednesday",
    "Thursday",
    "Friday",
    "Saturday",
    "Sunday"
];


/*
   Sri Lankan timetable:
   11 AM → 10 PM
*/

const times = [
    "11:00",
    "12:00",
    "1:00",
    "2:00",
    "3:00",
    "4:00",
    "5:00",
    "6:00",
    "7:00",
    "8:00",
    "9:00",
    "10:00"
];


let selectedSlot = null;


/* =========================================
   SRI LANKAN DATE
========================================= */

const sriLankaDate = new Intl.DateTimeFormat("en-CA", {
    timeZone: "Asia/Colombo",
    year: "numeric",
    month: "2-digit",
    day: "2-digit"
}).format(new Date());

const today = new Date(sriLankaDate + "T12:00:00");


/* =========================================
   GET MONDAY
========================================= */

function getMonday(date) {

    const d = new Date(date);

    const day = d.getDay();

    const difference =
        day === 0 ? -6 : 1 - day;

    d.setDate(
        d.getDate() + difference
    );

    d.setHours(0, 0, 0, 0);

    return d;
}


const monday = getMonday(today);


/* =========================================
   DATE KEY
========================================= */

function dateKey(date) {
    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, "0");
    const day = String(date.getDate()).padStart(2, "0");

    return `${year}-${month}-${day}`;
}


const weekKey = dateKey(monday);


/* =========================================
   FORMAT DATES
========================================= */

function formatDate(date) {

    return date.toLocaleDateString(
        "en-US",
        {
            month: "short",
            day: "numeric"
        }
    );

}


const sunday = new Date(monday);

sunday.setDate(
    monday.getDate() + 6
);


document.getElementById("weekLabel")
    .textContent =
    `${formatDate(monday)} – ${formatDate(sunday)}`;


/* =========================================
   BUILD CALENDAR
========================================= */

function buildCalendar() {

    calendar.innerHTML = "";


    /* TOP LEFT */

    const empty =
        document.createElement("div");

    empty.className =
        "time-header";

    calendar.appendChild(empty);


    /* DAY HEADERS */

    days.forEach((day, index) => {

        const header =
            document.createElement("div");

        header.className =
            "day-header";


        const date =
            new Date(monday);

        date.setDate(
            monday.getDate() + index
        );


        const isToday =
            dateKey(date) ===
            dateKey(today);


        if (isToday) {

            header.classList.add(
                "today-header"
            );

        }


        header.innerHTML = `
            <div class="day-name">
                ${day}
            </div>

            <div class="day-number">
                ${date.getDate()}
            </div>
        `;


        header.dataset.dayIndex =
            index;


        calendar.appendChild(header);

    });


    /* TIME ROWS */

    times.forEach(
        (time, timeIndex) => {

        const timeCell =
            document.createElement("div");

        timeCell.className =
            "time";

        timeCell.textContent =
            time;


        calendar.appendChild(
            timeCell
        );


        days.forEach(
            (day, dayIndex) => {

            const slot =
                document.createElement("div");

            slot.className =
                "slot";


            const date =
                new Date(monday);

            date.setDate(
                monday.getDate() + dayIndex
            );


            if (
                dateKey(date) ===
                dateKey(today)
            ) {

                slot.classList.add(
                    "today-column"
                );

            }


            slot.dataset.dayIndex =
                dayIndex;

            slot.dataset.time =
                time;


            const add =
                document.createElement("button");

            add.className =
                "add";

            add.textContent =
                "+";


            add.onclick = () =>
                openEventModal(slot);


            slot.appendChild(add);


            calendar.appendChild(slot);

        });

    });


    restoreUnusualDay();

}


/* =========================================
   UNUSUAL DAY STORAGE
========================================= */

function getUnusualData() {

    return JSON.parse(
        localStorage.getItem(
            "timetable-unusual-" +
            weekKey
        ) || "null"
    );

}


/* =========================================
   ACTIVATE UNUSUAL DAY
========================================= */

function activateUnusualDay(
    reason = null
) {

    const todaySlots =
        document.querySelectorAll(
            ".today-column"
        );


    todaySlots.forEach(slot => {

        if (
            !slot.querySelector(
                ".crack"
            )
        ) {

            const crackNames = [
                "one",
                "two",
                "three",
                "four"
            ];


            crackNames.forEach(name => {

                const crack =
                    document.createElement(
                        "div"
                    );

                crack.className =
                    `crack ${name}`;

                slot.appendChild(
                    crack
                );

            });

        }


        slot.classList.add(
            "cracked"
        );

    });


    unusualPanel.classList.add(
        "show"
    );


    if (reason) {

        showReason(reason);

    }

}


/* =========================================
   UNUSUAL BUTTON
========================================= */

unusualBtn.addEventListener(
    "click",
    () => {

        activateUnusualDay();


        localStorage.setItem(

            "timetable-unusual-" +
            weekKey,

            JSON.stringify({

                active: true,

                reason: null

            })

        );

    }
);


/* =========================================
   CHOOSE REASON
========================================= */

document
.querySelectorAll(".choice")
.forEach(button => {

    button.addEventListener(
        "click",
        () => {

            const reason =
                button.dataset.reason;


            localStorage.setItem(

                "timetable-unusual-" +
                weekKey,

                JSON.stringify({

                    active: true,

                    reason: reason

                })

            );


            showReason(reason);

        }
    );

});


function showReason(reason) {

    selectedMessage.style.display =
        "block";


    selectedMessage.textContent =
        `Today marked as: ${reason}`;

}


/* =========================================
   RESTORE UNUSUAL DAY
========================================= */

function restoreUnusualDay() {

    const data =
        getUnusualData();


    if (
        !data ||
        !data.active
    ) {

        return;

    }


    activateUnusualDay(
        data.reason
    );

}


/* =========================================
   EVENT MODAL
========================================= */

const modal =
    document.getElementById(
        "eventModal"
    );


const eventName =
    document.getElementById(
        "eventName"
    );


function openEventModal(slot) {

    selectedSlot =
        slot;


    eventName.value = "";


    modal.classList.add(
        "show"
    );


    setTimeout(
        () => eventName.focus(),
        50
    );

}


/* =========================================
   CANCEL EVENT
========================================= */

document.getElementById(
    "cancelModal"
).onclick = () => {

    modal.classList.remove(
        "show"
    );

};


/* =========================================
   SAVE EVENT
========================================= */

document.getElementById(
    "saveEvent"
).onclick = () => {

    const name =
        eventName.value.trim();


    if (
        !name ||
        !selectedSlot
    ) {

        return;

    }


    const event =
        document.createElement("div");

    event.className =
        "event";


    event.innerHTML = `

        <strong>
            ${escapeHTML(name)}
        </strong>

        <div class="event-time">
            ${selectedSlot.dataset.time}
        </div>

        <button class="delete-event">
            Delete
        </button>

    `;


    /* DELETE BUTTON */

    event
        .querySelector(
            ".delete-event"
        )
        .onclick = (e) => {

            e.stopPropagation();

            event.remove();

        };


    selectedSlot.insertBefore(

        event,

        selectedSlot.querySelector(
            ".add"
        )

    );


    modal.classList.remove(
        "show"
    );

};


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent =
        text;

    return div.innerHTML;

}


/* =========================================
   START
========================================= */

buildCalendar();

</script>

</body>
</html>
