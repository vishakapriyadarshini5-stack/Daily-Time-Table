<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timetable</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, Arial, sans-serif;
        color: #f5f5f7;
        background:
            radial-gradient(circle at 15% 20%, rgba(90, 120, 180, .16), transparent 30%),
            radial-gradient(circle at 85% 80%, rgba(150, 100, 180, .13), transparent 30%),
            #090a0d;
        overflow-x: hidden;
    }

    .page {
        width: min(1400px, 94%);
        margin: auto;
        padding: 34px 0 60px;
    }

    /* HEADER */

    .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 26px;
    }

    .title {
        font-size: 32px;
        font-weight: 700;
        letter-spacing: -1px;
    }

    .subtitle {
        color: #8e919a;
        margin-top: 5px;
        font-size: 14px;
    }

    .unusual-button {
        border: 1px solid rgba(255,255,255,.13);
        background: rgba(255,255,255,.07);
        color: #fff;
        padding: 13px 20px;
        border-radius: 999px;
        backdrop-filter: blur(18px);
        cursor: pointer;
        font-size: 14px;
        transition: .25s ease;
    }

    .unusual-button:hover {
        background: rgba(255,255,255,.12);
        transform: translateY(-1px);
    }

    /* CALENDAR */

    .calendar {
        display: grid;
        grid-template-columns: 72px repeat(7, 1fr);
        border: 1px solid rgba(255,255,255,.09);
        border-radius: 28px;
        overflow: hidden;
        background: rgba(255,255,255,.035);
        backdrop-filter: blur(25px);
    }

    .corner {
        border-right: 1px solid rgba(255,255,255,.07);
        border-bottom: 1px solid rgba(255,255,255,.07);
    }

    .day-header {
        padding: 18px 8px;
        text-align: center;
        font-size: 13px;
        color: #9b9da5;
        border-right: 1px solid rgba(255,255,255,.07);
        border-bottom: 1px solid rgba(255,255,255,.07);
    }

    .day-header.today {
        color: #fff;
        background: rgba(255,255,255,.06);
    }

    .day-column {
        min-width: 0;
        border-right: 1px solid rgba(255,255,255,.07);
        transition: transform .8s ease, opacity .8s ease;
    }

    .day-column:last-child,
    .day-header:last-child {
        border-right: none;
    }

    .time {
        height: 76px;
        padding: 12px 8px;
        text-align: right;
        color: #6e717a;
        font-size: 11px;
        border-right: 1px solid rgba(255,255,255,.07);
        border-bottom: 1px solid rgba(255,255,255,.05);
    }

    .slot {
        height: 76px;
        padding: 8px;
        border-bottom: 1px solid rgba(255,255,255,.05);
        position: relative;
    }

    /* EVENTS */

    .event {
        width: 100%;
        min-height: 56px;
        padding: 10px 13px;
        border-radius: 17px;
        background: rgba(255,255,255,.09);
        border: 1px solid rgba(255,255,255,.11);
        backdrop-filter: blur(16px);
        cursor: pointer;
        transition: .2s ease;
        overflow: hidden;
    }

    .event:hover {
        background: rgba(255,255,255,.14);
        transform: translateY(-1px);
    }

    .event-name {
        font-size: 13px;
        font-weight: 600;
    }

    .event-time {
        margin-top: 4px;
        font-size: 10px;
        color: #9699a2;
    }

    .add-event {
        width: 100%;
        height: 100%;
        min-height: 56px;
        border: 1px dashed rgba(255,255,255,.08);
        border-radius: 17px;
        background: transparent;
        color: #555862;
        cursor: pointer;
        transition: .2s;
    }

    .add-event:hover {
        color: #aaa;
        border-color: rgba(255,255,255,.18);
        background: rgba(255,255,255,.03);
    }

    /* TODAY */

    .today-column {
        background: rgba(255,255,255,.025);
    }

    /* UNUSUAL DAY */

    .calendar.unusual .today-column {
        animation: crackFall .9s cubic-bezier(.7,0,.2,1) forwards;
    }

    @keyframes crackFall {
        0% {
            transform: translate(0,0) rotate(0);
            opacity: 1;
        }

        35% {
            transform: translate(0,10px) rotate(-1deg);
        }

        100% {
            transform: translate(0,150px) rotate(4deg);
            opacity: 0;
        }
    }

    .crack {
        position: absolute;
        pointer-events: none;
        width: 2px;
        height: 80px;
        background: rgba(255,255,255,.55);
        transform: rotate(28deg);
        opacity: 0;
    }

    .calendar.unusual .crack {
        animation: crackAppear .45s ease forwards;
    }

    @keyframes crackAppear {
        from {
            opacity: 0;
            transform: scaleY(0) rotate(28deg);
        }

        to {
            opacity: .7;
            transform: scaleY(1) rotate(28deg);
        }
    }

    /* UNUSUAL PANEL */

    .unusual-panel {
        display: none;
        margin-top: 24px;
        padding: 30px;
        border-radius: 28px;
        border: 1px solid rgba(255,255,255,.1);
        background: rgba(255,255,255,.055);
        backdrop-filter: blur(25px);
        text-align: center;
    }

    .unusual-panel.show {
        display: block;
        animation: panelIn .7s ease forwards;
    }

    @keyframes panelIn {
        from {
            opacity: 0;
            transform: translateY(20px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .panel-title {
        font-size: 22px;
        font-weight: 650;
    }

    .panel-subtitle {
        color: #858892;
        font-size: 13px;
        margin: 8px 0 22px;
    }

    .choices {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 10px;
    }

    .choice {
        border: 1px solid rgba(255,255,255,.1);
        background: rgba(255,255,255,.06);
        color: #eee;
        border-radius: 999px;
        padding: 12px 18px;
        cursor: pointer;
        transition: .2s;
    }

    .choice:hover {
        background: rgba(255,255,255,.12);
    }

    .reset {
        margin-top: 22px;
        border: none;
        background: transparent;
        color: #858892;
        cursor: pointer;
    }

    /* MODAL */

    .modal {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: rgba(0,0,0,.45);
        backdrop-filter: blur(10px);
        z-index: 10;
    }

    .modal.show {
        display: flex;
    }

    .modal-box {
        width: min(420px, 100%);
        padding: 25px;
        border-radius: 26px;
        border: 1px solid rgba(255,255,255,.12);
        background: rgba(25,26,31,.88);
        backdrop-filter: blur(25px);
    }

    .modal-box h2 {
        margin-top: 0;
    }

    .input {
        width: 100%;
        margin: 8px 0;
        padding: 13px;
        border-radius: 13px;
        border: 1px solid rgba(255,255,255,.1);
        background: rgba(255,255,255,.06);
        color: white;
        outline: none;
    }

    .modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 15px;
    }

    .modal-actions button {
        border: none;
        padding: 11px 17px;
        border-radius: 999px;
        cursor: pointer;
    }

    .cancel {
        background: rgba(255,255,255,.07);
        color: white;
    }

    .save {
        background: white;
        color: black;
    }

    @media (max-width: 850px) {
        .calendar {
            grid-template-columns: 55px repeat(7, 150px);
            overflow-x: auto;
        }

        .page {
            width: 96%;
        }
    }
</style>
</head>

<body>

<div class="page">

    <header class="header">
        <div>
            <div class="title">Timetable</div>
            <div class="subtitle" id="weekLabel">Your week, your way.</div>
        </div>

        <button class="unusual-button" id="unusualButton">
            Unusual day
        </button>
    </header>

    <div class="calendar" id="calendar">

        <div class="corner"></div>

        <div class="day-header">MON</div>
        <div class="day-header">TUE</div>
        <div class="day-header">WED</div>
        <div class="day-header">THU</div>
        <div class="day-header">FRI</div>
        <div class="day-header">SAT</div>
        <div class="day-header">SUN</div>

        <!-- TIME + DAYS -->

        <div class="time">08:00</div>

        <div class="slot"><button class="add-event">+</button></div>
        <div class="slot"><button class="add-event">+</button></div>
        <div class="slot"><button class="add-event">+</button></div>
        <div class="slot"><button class="add-event">+</button></div>
        <div class="slot"><button class="add-event">+</button></div>
        <div class="slot"><button class="add-event">+</button></div>
        <div class="slot"><button class="add-event">+</button></div>

        <div class="time">09:00</div>

        <div class="slot"><button class="add-event">+</button></div>
        <div class="slot"><button class="add-event">+</button></div>
        <div class="slot"><button class="add-event">+</button></div>
        <div class="slot"><button class="add-event">+</button></div>
        <div class="slot"><button class="add-event">+</button></div>
        <div class="slot"><button class="add-event">+</button></div>
        <div class="slot"><button class="add-event">+</button></div>

        <div class="time">10:00</div>

        <div class="slot"><button class="add-event">+</button></div>
        <div class="slot"><button class="add-event">+</button></div>
        <div class="slot"><button class="add-event">+</button></div>
        <div class="slot"><button class="add-event">+</button></div>
        <div class="slot"><button class="add-event">+</button></div>
        <div class="slot"><button class="add-event">+</button></div>
        <div class="slot"><button class="add-event">+</button></div>

        <div class="time">11:00</div>

        <div class="slot"><button class="add-event">+</button></div>
        <div class="slot"><button class="add-event">+</button></div>
        <div class="slot"><button class="add-event">+</button></div>
        <div class="slot"><button class="add-event">+</button></div>
        <div class="slot"><button class="add-event">+</button></div>
        <div class="slot"><button class="add-event">+</button></div>
        <div class="slot"><button class="add-event">+</button></div>

        <div class="time">12:00</div>

        <div class="slot"><button class="add-event">+</button></div>
        <div class="slot"><button class="add-event">+</button></div>
        <div class="slot"><button class="add-event">+</button></div>
        <div class="slot"><button class="add-event">+</button></div>
        <div class="slot"><button class="add-event">+</button></div>
        <div class="slot"><button class="add-event">+</button></div>
        <div class="slot"><button class="add-event">+</button></div>

    </div>

    <section class="unusual-panel" id="unusualPanel">

        <div class="panel-title">
            Today is different.
        </div>

        <div class="panel-subtitle">
            What happened today?
        </div>

        <div class="choices">
            <button class="choice">👨‍👩‍👧 Family / cousin</button>
            <button class="choice">🚗 Went out</button>
            <button class="choice">👨 Dad's stuff</button>
            <button class="choice">✦ Something else</button>
        </div>

        <button class="reset" id="resetButton">
            Return to timetable
        </button>

    </section>

</div>

<!-- EVENT MODAL -->

<div class="modal" id="modal">

    <div class="modal-box">

        <h2>Add event</h2>

        <input
            class="input"
            id="eventName"
            placeholder="Event name"
        >

        <input
            class="input"
            id="eventTime"
            placeholder="Time, e.g. 8:00 - 9:00"
        >

        <div class="modal-actions">

            <button class="cancel" id="cancelButton">
                Cancel
            </button>

            <button class="save" id="saveButton">
                Add
            </button>

        </div>

    </div>

</div>

<script>

    const calendar = document.getElementById("calendar");
    const unusualButton = document.getElementById("unusualButton");
    const unusualPanel = document.getElementById("unusualPanel");
    const resetButton = document.getElementById("resetButton");

    const modal = document.getElementById("modal");
    const eventName = document.getElementById("eventName");
    const eventTime = document.getElementById("eventTime");

    const cancelButton = document.getElementById("cancelButton");
    const saveButton = document.getElementById("saveButton");

    let selectedSlot = null;

    /* FIND TODAY */

    const today = new Date();

    // JavaScript: Sunday = 0, Monday = 1...
    let dayIndex = today.getDay();

    if (dayIndex === 0) {
        dayIndex = 7;
    }

    // Header row is:
    // corner + 7 day headers
    const headers = document.querySelectorAll(".day-header");

    headers.forEach((header, index) => {
        if (index === dayIndex - 1) {
            header.classList.add("today");
        }
    });

    // Find today's column slots
    const allSlots = document.querySelectorAll(".slot");

    allSlots.forEach((slot, index) => {

        const column = index % 7;

        if (column === dayIndex - 1) {
            slot.parentElement.classList.add("today-column");
        }

    });

    /* UNUSUAL DAY */

    unusualButton.addEventListener("click", () => {

        calendar.classList.add("unusual");

        setTimeout(() => {
            unusualPanel.classList.add("show");
        }, 500);

        unusualButton.textContent = "Today's timetable";
    });

    resetButton.addEventListener("click", () => {

        unusualPanel.classList.remove("show");

        calendar.classList.remove("unusual");

        unusualButton.textContent = "Unusual day";

    });

    /* EVENT MODAL */

    document.querySelectorAll(".add-event").forEach(button => {

        button.addEventListener("click", () => {

            selectedSlot = button.parentElement;

            modal.classList.add("show");

            eventName.focus();

        });

    });

    cancelButton.addEventListener("click", () => {

        modal.classList.remove("show");

        eventName.value = "";
        eventTime.value = "";

    });

    saveButton.addEventListener("click", () => {

        const name = eventName.value.trim();
        const time = eventTime.value.trim();

        if (!name) {
            eventName.focus();
            return;
        }

        const event = document.createElement("div");

        event.className = "event";

        event.innerHTML = `
            <div class="event-name">${name}</div>
            <div class="event-time">${time || "Scheduled"}</div>
        `;

        selectedSlot.innerHTML = "";
        selectedSlot.appendChild(event);

        modal.classList.remove("show");

        eventName.value = "";
        eventTime.value = "";

    });

</script>

</body>
</html>
