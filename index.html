<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timetable</title>
<style>
    * { box-sizing: border-box; }

    body {
        margin: 0;
        padding: 32px;
        background: #0e0e0e;
        color: #e8e8e8;
        font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        max-width: 1100px;
        margin: 0 auto 28px;
    }

    h1 { margin: 0; font-size: 22px; font-weight: 500; }
    #weekLabel { margin: 4px 0 0; color: #666; font-size: 13px; }

    button {
        font-family: inherit;
        cursor: pointer;
        background: none;
        color: #e8e8e8;
        border: 1px solid #2a2a2a;
        border-radius: 6px;
        padding: 8px 14px;
        font-size: 13px;
    }
    button:hover { border-color: #555; }

    .calendar {
        max-width: 1100px;
        margin: 0 auto;
        overflow-x: auto;
        display: grid;
        grid-template-columns: 60px repeat(7, minmax(120px, 1fr));
        border-top: 1px solid #1f1f1f;
        border-left: 1px solid #1f1f1f;
    }

    .cell {
        height: 64px;
        border-right: 1px solid #1f1f1f;
        border-bottom: 1px solid #1f1f1f;
        padding: 6px;
        position: relative;
    }

    .day-header {
        height: 64px;
        padding: 10px;
        border-right: 1px solid #1f1f1f;
        border-bottom: 1px solid #1f1f1f;
        font-size: 12px;
        color: #777;
    }
    .day-header .num { display: block; font-size: 18px; color: #e8e8e8; margin-top: 2px; }

    .time { font-size: 11px; color: #555; text-align: center; padding-top: 6px; }

    .today { background: #151515; }
    .today-header .num::after { content: " ·"; color: #888; }

    .slot:hover { background: #131313; }
    .slot .add {
        position: absolute;
        right: 6px;
        bottom: 6px;
        opacity: 0;
        width: 22px;
        height: 22px;
        padding: 0;
        border-radius: 50%;
        line-height: 1;
    }
    .slot:hover .add { opacity: 1; }

    .event {
        background: #1c1c1c;
        border: 1px solid #2a2a2a;
        border-radius: 6px;
        padding: 6px 8px;
        font-size: 12px;
        margin-bottom: 4px;
        position: relative;
        z-index: 2;
    }
    .event small { display: block; color: #666; font-size: 10px; margin-top: 2px; }
    .event .delete {
        border: none;
        padding: 0;
        margin-top: 4px;
        font-size: 10px;
        color: #666;
    }
    .event .delete:hover { color: #e8e8e8; }

    .unusual-panel {
        display: none;
        max-width: 1100px;
        margin: 24px auto 0;
        padding: 18px;
        border: 1px solid #1f1f1f;
        border-radius: 8px;
        font-size: 13px;
    }
    .unusual-panel.show { display: block; }
    .unusual-panel p { margin: 0 0 12px; color: #777; }
    .choices { display: flex; gap: 8px; flex-wrap: wrap; }
    #selectedMessage { margin-top: 12px; color: #888; display: none; }

    .modal {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.7);
        align-items: center;
        justify-content: center;
        z-index: 100;
    }
    .modal.show { display: flex; }
    .modal-box {
        width: min(360px, calc(100% - 32px));
        background: #141414;
        border: 1px solid #2a2a2a;
        border-radius: 10px;
        padding: 22px;
    }
    .modal-box h2 { margin: 0 0 14px; font-size: 16px; font-weight: 500; }
    input {
        width: 100%;
        padding: 10px 12px;
        background: #0e0e0e;
        border: 1px solid #2a2a2a;
        border-radius: 6px;
        color: #e8e8e8;
        font-family: inherit;
        font-size: 14px;
        outline: none;
    }
    input:focus { border-color: #555; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
    .save { background: #e8e8e8; color: #0e0e0e; border-color: #e8e8e8; }

    @media (max-width: 700px) {
        body { padding: 18px; }
        header { flex-direction: column; align-items: flex-start; gap: 14px; }
    }
</style>
</head>
<body>

<header>
    <div>
        <h1>Timetable</h1>
        <p id="weekLabel"></p>
    </div>
    <button id="unusualBtn">Unusual day</button>
</header>

<div class="calendar" id="calendar"></div>

<div class="unusual-panel" id="unusualPanel">
    <p>What changed today?</p>
    <div class="choices">
        <button class="choice" data-reason="Family / cousin">Family / cousin</button>
        <button class="choice" data-reason="Went out">Went out</button>
        <button class="choice" data-reason="Something else">Something else</button>
    </div>
    <div id="selectedMessage"></div>
</div>

<div class="modal" id="eventModal">
    <div class="modal-box">
        <h2>Add event</h2>
        <input id="eventName" placeholder="Event name">
        <div class="modal-actions">
            <button id="cancelModal">Cancel</button>
            <button class="save" id="saveEvent">Add</button>
        </div>
    </div>
</div>

<script>
const days = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
const times = ["11:00","12:00","1:00","2:00","3:00","4:00","5:00","6:00","7:00","8:00","9:00","10:00"];

const calendar = document.getElementById("calendar");
const unusualBtn = document.getElementById("unusualBtn");
const unusualPanel = document.getElementById("unusualPanel");
const selectedMessage = document.getElementById("selectedMessage");
const modal = document.getElementById("eventModal");
const eventName = document.getElementById("eventName");
let selectedSlot = null;

// Sri Lanka date
const sriLankaDate = new Intl.DateTimeFormat("en-CA", {
    timeZone: "Asia/Colombo", year: "numeric", month: "2-digit", day: "2-digit"
}).format(new Date());
const today = new Date(sriLankaDate + "T12:00:00");

function getMonday(date) {
    const d = new Date(date);
    const diff = d.getDay() === 0 ? -6 : 1 - d.getDay();
    d.setDate(d.getDate() + diff);
    d.setHours(0, 0, 0, 0);
    return d;
}

function dateKey(date) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, "0");
    const d = String(date.getDate()).padStart(2, "0");
    return `${y}-${m}-${d}`;
}

const monday = getMonday(today);
const sunday = new Date(monday);
sunday.setDate(monday.getDate() + 6);
const weekKey = dateKey(monday);

const fmt = d => d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
document.getElementById("weekLabel").textContent = `${fmt(monday)} – ${fmt(sunday)}`;

function escapeHTML(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
}

function buildCalendar() {
    calendar.innerHTML = "";

    const corner = document.createElement("div");
    calendar.appendChild(corner);

    days.forEach((day, i) => {
        const date = new Date(monday);
        date.setDate(monday.getDate() + i);
        const isToday = dateKey(date) === dateKey(today);

        const header = document.createElement("div");
        header.className = "day-header" + (isToday ? " today-header" : "");
        header.innerHTML = `${day}<span class="num">${date.getDate()}</span>`;
        calendar.appendChild(header);
    });

    times.forEach(time => {
        const timeCell = document.createElement("div");
        timeCell.className = "time";
        timeCell.textContent = time;
        calendar.appendChild(timeCell);

        days.forEach((day, i) => {
            const date = new Date(monday);
            date.setDate(monday.getDate() + i);

            const slot = document.createElement("div");
            slot.className = "cell slot";
            if (dateKey(date) === dateKey(today)) slot.classList.add("today");
            slot.dataset.time = time;

            const add = document.createElement("button");
            add.className = "add";
            add.textContent = "+";
            add.onclick = () => openEventModal(slot);
            slot.appendChild(add);

            calendar.appendChild(slot);
        });
    });

    restoreUnusualDay();
}

/* UNUSUAL DAY */

function getUnusualData() {
    return JSON.parse(localStorage.getItem("timetable-unusual-" + weekKey) || "null");
}

function showReason(reason) {
    selectedMessage.style.display = "block";
    selectedMessage.textContent = `Today marked as: ${reason}`;
}

function activateUnusualDay(reason = null) {
    unusualPanel.classList.add("show");
    if (reason) showReason(reason);
}

unusualBtn.addEventListener("click", () => {
    if (getUnusualData()?.active) {
        localStorage.removeItem("timetable-unusual-" + weekKey);
        location.reload();
        return;
    }
    activateUnusualDay();
    localStorage.setItem("timetable-unusual-" + weekKey, JSON.stringify({ active: true, reason: null }));
    unusualBtn.textContent = "Undo";
});

document.querySelectorAll(".choice").forEach(button => {
    button.addEventListener("click", () => {
        const reason = button.dataset.reason;
        localStorage.setItem("timetable-unusual-" + weekKey, JSON.stringify({ active: true, reason }));
        showReason(reason);
    });
});

function restoreUnusualDay() {
    const data = getUnusualData();
    if (data?.active) {
        activateUnusualDay(data.reason);
        unusualBtn.textContent = "Undo";
    }
}

/* EVENTS */

function openEventModal(slot) {
    selectedSlot = slot;
    eventName.value = "";
    modal.classList.add("show");
    setTimeout(() => eventName.focus(), 50);
}

document.getElementById("cancelModal").onclick = () => modal.classList.remove("show");

document.getElementById("saveEvent").onclick = () => {
    const name = eventName.value.trim();
    if (!name || !selectedSlot) return;

    const event = document.createElement("div");
    event.className = "event";
    event.innerHTML = `
        <strong>${escapeHTML(name)}</strong>
        <small>${selectedSlot.dataset.time}</small>
        <button class="delete">Delete</button>
    `;

    event.querySelector(".delete").onclick = e => {
        e.stopPropagation();
        event.remove();
    };

    selectedSlot.insertBefore(event, selectedSlot.querySelector(".add"));
    modal.classList.remove("show");
};

buildCalendar();
</script>

</body>
</html>
